<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#141c26">
  <title>ÖSYM KPSS Önlisans Duvar Saati & Prova Saati</title>
  <style>
    :root {
      --wall-tone-1: #253342;
      --wall-tone-2: #141c26;
      --clock-scale: 1.0;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      min-height: -webkit-fill-available;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at 50% 45%, var(--wall-tone-1) 0%, var(--wall-tone-2) 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(ellipse at 50% 30%, rgba(255, 255, 255, 0.04) 0%, rgba(0, 0, 0, 0.45) 100%);
      pointer-events: none;
      z-index: 1;
    }

    /* Saat Alanı ve Ölçeklendirme */
    #clock-wrapper {
      position: relative;
      width: min(64vw, 64vh);
      height: min(64vw, 64vh);
      max-width: 560px;
      max-height: 560px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2;
      transform: scale(var(--clock-scale));
      transform-origin: center center;
      transition: width 0.35s ease, height 0.35s ease, max-width 0.35s ease, max-height 0.35s ease, transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
      filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.65)) drop-shadow(0 6px 14px rgba(0, 0, 0, 0.4));
    }

    /* Tam Ekran / Mobil Tam Ekran Modu */
    :fullscreen #clock-wrapper,
    :-webkit-full-screen #clock-wrapper,
    .is-fullscreen #clock-wrapper {
      width: min(92vw, 92dvh);
      height: min(92vw, 92dvh);
      max-width: 950px;
      max-height: 950px;
    }

    /* iPhone SE ve Küçük Ekran Uyarlaması (Portrait) */
    @media (max-width: 480px) {
      #clock-wrapper {
        width: min(72vw, 38dvh);
        height: min(72vw, 38dvh);
        filter: drop-shadow(0 14px 28px rgba(0, 0, 0, 0.65)) drop-shadow(0 4px 10px rgba(0, 0, 0, 0.35));
      }

      .is-fullscreen #clock-wrapper {
        width: min(88vw, 68dvh);
        height: min(88vw, 68dvh);
      }
    }

    /* Yatay Mobil (Landscape: 667x375) */
    @media (max-height: 500px) and (orientation: landscape) {
      #clock-wrapper {
        width: min(58dvh, 58vw);
        height: min(58dvh, 58vw);
      }
      .is-fullscreen #clock-wrapper {
        width: min(88dvh, 88vw);
        height: min(88dvh, 88vw);
      }
    }

    svg#clock-svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    /* Üst Durum Göstergesi (HUD) */
    .top-hud {
      position: fixed;
      top: max(14px, calc(var(--safe-top) + 6px));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.90);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 40px;
      padding: 7px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #f1f5f9;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      z-index: 20;
      transition: opacity 0.35s ease, transform 0.35s ease;
      white-space: nowrap;
      max-width: calc(100vw - 20px);
    }

    .top-hud.hidden {
      opacity: 0;
      transform: translateX(-50%) translateY(-20px);
      pointer-events: none;
    }

    .hud-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.2px;
      transition: all 0.25s ease;
    }

    .hud-pill.turkce { background: rgba(2, 132, 199, 0.22); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.45); }
    .hud-pill.matematik { background: rgba(22, 163, 74, 0.22); color: #4ade80; border: 1px solid rgba(74, 222, 128, 0.45); }
    .hud-pill.gk { background: rgba(147, 51, 234, 0.22); color: #c084fc; border: 1px solid rgba(192, 132, 252, 0.45); }
    .hud-pill.tarih { background: rgba(168, 85, 247, 0.22); color: #d8b4fe; border: 1px solid rgba(216, 180, 254, 0.45); }
    .hud-pill.cografya { background: rgba(245, 158, 11, 0.22); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.45); }
    .hud-pill.vatandaslik { background: rgba(236, 72, 153, 0.22); color: #f472b6; border: 1px solid rgba(244, 114, 182, 0.45); }
    .hud-pill.bitti { background: rgba(239, 68, 68, 0.25); color: #f87171; border: 1px solid rgba(248, 113, 113, 0.5); }

    .hud-time {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      color: #f59e0b;
      font-size: 14.5px;
    }

    @media (max-width: 480px) {
      .top-hud {
        top: max(8px, calc(var(--safe-top) + 4px));
        padding: 5px 12px;
        gap: 6px;
        font-size: 11.5px;
        border-radius: 20px;
      }

      .hud-pill {
        padding: 2px 7px;
        font-size: 11px;
      }

      .hud-time {
        font-size: 13.5px;
      }
    }

    @media (max-height: 500px) and (orientation: landscape) {
      .top-hud {
        top: max(5px, var(--safe-top));
        padding: 3px 10px;
        font-size: 11px;
        gap: 5px;
      }
      .hud-pill { padding: 1.5px 6px; font-size: 10.5px; }
      .hud-time { font-size: 12.5px; }
    }

    /* Alt Kontrol Paneli */
    .controls-container {
      position: fixed;
      bottom: max(14px, calc(var(--safe-bottom) + 8px));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      z-index: 20;
      transition: opacity 0.35s ease, transform 0.35s ease;
      width: 100%;
      max-width: 100vw;
      padding: 0 10px;
      pointer-events: none;
    }

    .controls-container.hidden {
      opacity: 0;
      transform: translateX(-50%) translateY(20px);
      pointer-events: none;
    }

    .control-row {
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      padding: 7px 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.6);
      flex-wrap: wrap;
      justify-content: center;
      max-width: 100%;
    }

    .c-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #f8fafc;
      font-size: 12.5px;
      font-weight: 600;
      padding: 6.5px 12px;
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
      white-space: nowrap;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      min-height: 36px;
    }

    .c-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .c-btn:active {
      transform: scale(0.96);
    }

    .c-btn.active {
      background: #2563eb;
      border-color: #60a5fa;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(37, 99, 235, 0.45);
    }

    .c-btn.btn-play.active {
      background: #16a34a;
      border-color: #4ade80;
      box-shadow: 0 0 12px rgba(22, 163, 74, 0.45);
    }

    .c-btn.btn-branch {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.25);
      color: #e2e8f0;
      font-size: 11.5px;
      padding: 6px 10px;
    }

    .c-btn.btn-branch:hover {
      background: rgba(51, 65, 85, 0.95);
      border-color: rgba(148, 163, 184, 0.5);
    }

    .c-btn.btn-branch.active-branch {
      background: #3b82f6;
      border-color: #93c5fd;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.5);
    }

    .c-btn.btn-branch.mat.active-branch {
      background: #16a34a;
      border-color: #86efac;
      box-shadow: 0 0 12px rgba(22, 163, 74, 0.5);
    }

    .c-btn.btn-branch.gk.active-branch {
      background: #8b5cf6;
      border-color: #c4b5fd;
      box-shadow: 0 0 12px rgba(139, 92, 246, 0.5);
    }

    .c-btn.btn-branch.cog.active-branch {
      background: #d97706;
      border-color: #fcd34d;
      box-shadow: 0 0 12px rgba(217, 119, 6, 0.5);
    }

    .c-btn.btn-branch.vat.active-branch {
      background: #db2777;
      border-color: #f472b6;
      box-shadow: 0 0 12px rgba(219, 39, 119, 0.5);
    }

    /* iPhone SE 3 & Mobil Kontrol Uyarlamaları */
    @media (max-width: 480px) {
      .controls-container {
        bottom: max(8px, calc(var(--safe-bottom) + 4px));
        gap: 5px;
        padding: 0 6px;
      }

      .control-row {
        padding: 5px 8px;
        gap: 4px;
        border-radius: 14px;
      }

      .c-btn {
        font-size: 11.5px;
        padding: 5.5px 8.5px;
        border-radius: 8px;
        min-height: 34px;
        gap: 4px;
      }

      /* Ana Buton Çubuğu: 4 butonu 375px genişliğe tam sığdırır */
      #mainControlsRow {
        flex-wrap: nowrap;
        justify-content: space-between;
        width: 100%;
        max-width: 365px;
      }

      #mainControlsRow .c-btn {
        flex: 1;
        padding: 5.5px 4px;
        font-size: 11px;
      }

      /* Branş Butonları Çubuğu: Yatay Kaydırılabilir Çipler */
      #branchControlsRow {
        flex-wrap: nowrap;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        justify-content: flex-start;
        max-width: calc(100vw - 12px);
        padding: 5px 8px;
        scrollbar-width: none;
      }

      #branchControlsRow::-webkit-scrollbar {
        display: none;
      }

      #branchControlsRow .c-btn {
        flex-shrink: 0;
        font-size: 11px;
        padding: 5px 9px;
        border-radius: 20px;
      }

      /* Prova Saati İşlem Kontrolleri */
      #examControlsRow {
        flex-wrap: nowrap;
        justify-content: center;
        gap: 5px;
        max-width: 365px;
        width: 100%;
      }

      #examControlsRow .c-btn {
        flex: 1;
        font-size: 11px;
        padding: 5.5px 6px;
      }
    }

    /* Yatay Mod (Landscape) Kontroller */
    @media (max-height: 500px) and (orientation: landscape) {
      .controls-container {
        bottom: max(4px, var(--safe-bottom));
        gap: 3px;
        padding: 0 4px;
      }
      .control-row {
        padding: 4px 8px;
        gap: 4px;
        border-radius: 12px;
      }
      .c-btn {
        font-size: 10.5px;
        padding: 3.5px 7px;
        min-height: 28px;
      }
      #branchControlsRow {
        flex-wrap: nowrap;
        overflow-x: auto;
        max-width: calc(100vw - 16px);
      }
      #branchControlsRow .c-btn {
        flex-shrink: 0;
      }
    }

    /* Dropdown Menü (Genel Kültür Alt Dalları) */
    .dropdown-container {
      position: relative;
      display: inline-flex;
    }

    .dropdown-menu {
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: rgba(15, 23, 42, 0.98);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 14px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 210px;
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.7);
      opacity: 0;
      pointer-events: none;
      transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 35;
    }

    .dropdown-menu.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    .dropdown-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 12px;
      background: transparent;
      border: none;
      border-radius: 8px;
      color: #f1f5f9;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s ease;
      white-space: nowrap;
      min-height: 34px;
    }

    .dropdown-item:hover, .dropdown-item:active {
      background: rgba(255, 255, 255, 0.12);
    }

    .dropdown-item .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
    }

    /* Ayarlar Modalı */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      padding: 12px;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 20px;
      width: 94vw;
      max-width: 480px;
      max-height: 88vh;
      max-height: 88dvh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 20px 18px;
      color: #f8fafc;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85);
      transform: scale(0.95);
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .modal-backdrop.open .modal-card {
      transform: scale(1);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .modal-header h2 {
      font-size: 16.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 7px;
      color: #f1f5f9;
    }

    .btn-close-modal {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #94a3b8;
      font-size: 16px;
      cursor: pointer;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: all 0.15s;
    }

    .btn-close-modal:hover, .btn-close-modal:active {
      background: rgba(255, 255, 255, 0.2);
      color: #f8fafc;
    }

    .modal-section {
      margin-bottom: 18px;
    }

    .modal-section-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #60a5fa;
      margin-bottom: 9px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .setting-item {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .setting-item label {
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* iOS Safari 16px font-size: Otomatik zoomu engeller */
    .setting-item input[type="time"] {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #f8fafc;
      padding: 6px 8px;
      border-radius: 8px;
      font-size: 16px !important;
      font-weight: 600;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
      text-align: center;
      -webkit-appearance: none;
      min-height: 38px;
    }

    .setting-item input[type="time"]:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25);
    }

    /* Mobil Ayarlar Düzeni (iPhone SE) */
    @media (max-width: 480px) {
      .modal-card {
        padding: 16px 14px;
        border-radius: 16px;
      }

      .settings-grid {
        grid-template-columns: 1fr;
        gap: 6px;
      }

      .setting-item {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        padding: 7px 10px;
      }

      .setting-item label {
        font-size: 12px;
        white-space: nowrap;
      }

      .setting-item input[type="time"] {
        width: 108px;
        padding: 4px 6px;
        min-height: 34px;
      }
    }

    /* Ölçek Kaydırıcı */
    .scale-control-box {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .scale-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
      font-weight: 600;
      color: #cbd5e1;
    }

    .scale-value-badge {
      background: #2563eb;
      color: #ffffff;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 12px;
    }

    .scale-slider {
      width: 100%;
      height: 8px;
      background: #334155;
      border-radius: 4px;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
      cursor: pointer;
    }

    .scale-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      background: #60a5fa;
      border: 2px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(37, 99, 235, 0.6);
      cursor: pointer;
    }

    .scale-presets {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
    }

    .btn-preset {
      padding: 6px 4px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      color: #cbd5e1;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .btn-preset:hover, .btn-preset:active {
      background: rgba(255, 255, 255, 0.16);
      color: #ffffff;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 14px;
    }

    .btn-save-settings {
      flex: 2;
      background: #2563eb;
      border: 1px solid #60a5fa;
      color: #ffffff;
      padding: 9px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
      transition: all 0.2s;
      min-height: 42px;
    }

    .btn-save-settings:hover, .btn-save-settings:active {
      background: #1d4ed8;
      transform: translateY(-1px);
    }

    .btn-reset-settings {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #cbd5e1;
      padding: 9px 10px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
      min-height: 42px;
      white-space: nowrap;
    }

</head>
<body>

  <!-- Üst Bilgi Barı (HUD) -->
  <div id="topHud" class="top-hud">

  <!-- Saat SVG -->
  <div id="clock-wrapper">
    <svg id="clock-svg" viewBox="-300 -300 600 600" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
      <defs>
        <!-- Krom/Gümüş Dış Çerçeve Degradesi -->
        <linearGradient id="metalBezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" />

          <stop offset="45%" stop-color="#94a3b8" />
          <stop offset="75%" stop-color="#f1f5f9" />

        <radialGradient id="bevelShade" cx="30%" cy="25%" r="75%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
          <stop offset="50%" stop-color="#64748b" stop-opacity="0.1" />

        <!-- İncelmiş Normal İç Siyah Halka -->
        <radialGradient id="innerDarkBezel" cx="50%" cy="50%" r="50%">
          <stop offset="88%" stop-color="#242c38" />
          <stop offset="96%" stop-color="#111827" />
          <stop offset="100%" stop-color="#030712" />

        <!-- Sıcak Fildişi Kadran Zemin Degradesi -->
        <radialGradient id="dialGradient" cx="48%" cy="45%" r="60%">

        <!-- İnce Cam Yansıması -->
        <linearGradient id="glassSheen" x1="15%" y1="0%" x2="85%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
          <stop offset="35%" stop-color="#ffffff" stop-opacity="0.04" />
          <stop offset="55%" stop-color="#ffffff" stop-opacity="0.0" />

        <!-- Kollar İçin Doğal Gölge -->

      <!-- 1. Dış Metalik Krom Çerçeve -->
      <circle r="294" fill="url(#metalBezelGrad)" />

      <!-- 2. İncelmiş Normal İç Siyah Halka -->

      <!-- 3. Kadran Zemini -->

      <!-- Dış Dakika Çemberi -->
      <circle r="248" fill="none" stroke="#333333" stroke-width="1.2" />

      <!-- 60 Dakika & Saat Çizgileri -->
      <g id="svgTicksGroup"></g>

      <!-- ÖSYM Logosu -->
      <image 
        href="https://thumb.wikimedia.org/wikipedia/commons/thumb/3/33/%C3%96SYM.svg/1280px-%C3%96SYM.svg.png?utm_source=tr.wikipedia.org&utm_campaign=index&utm_content=thumbnail"
        xlink:href="https://thumb.wikimedia.org/wikipedia/commons/thumb/3/33/%C3%96SYM.svg/1280px-%C3%96SYM.svg.png?utm_source=tr.wikipedia.org&utm_campaign=index&utm_content=thumbnail"
        x="-78" y="-118" width="156" height="54"
        preserveAspectRatio="xMidYMid meet"
      />

      <!-- 1 - 12 Rakamları -->
      <g id="svgNumbersGroup" font-family="'Arial Black', 'Impact', 'Trebuchet MS', sans-serif" font-weight="900" font-size="46" fill="#18181b" text-anchor="middle" dominant-baseline="central"></g>

      <!-- İnce Cam Parlaması -->
      <circle r="256" fill="url(#glassSheen)" pointer-events="none" />

      <!-- Kollar -->
      <!-- Akrep -->
      <g id="svgHourHand" filter="url(#shadowFilter)">
        <path d="M -7.5 22 L -6.5 -125 L 0 -150 L 6.5 -125 L 7.5 22 L 0 30 Z" fill="#111827" />
        <line x1="0" y1="-146" x2="0" y2="26" stroke="#374151" stroke-width="1.2" />

      <!-- Yelkovan -->
      <g id="svgMinuteHand" filter="url(#shadowFilter)">

        <line x1="0" y1="-236" x2="0" y2="32" stroke="#334155" stroke-width="1" />
      </g>

      <!-- Kırmızı Saniye İbresi -->
      <g id="svgSecondHand" filter="url(#secondShadowFilter)">
        <line x1="0" y1="0" x2="0" y2="-242" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" />
        <rect x="-4.5" y="18" width="9" height="38" fill="#b91c1c" rx="1" />
        <line x1="0" y1="0" x2="0" y2="64" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" />
        <circle cx="0" cy="0" r="4.5" fill="#dc2626" />
      </g>

      <!-- Pirinç Göbek Vidası -->
      <circle cx="0" cy="0" r="7.5" fill="#0f172a" />
      <circle cx="0" cy="0" r="4.2" fill="#d4af37" />

  <!-- Ayarlar Modalı -->
  <div id="settingsModalBackdrop" class="modal-backdrop">

        <div class="settings-grid">
          <div class="setting-item">

          <div class="setting-item">
            <label for="inpTurkceStart">📖 Türkçe Başlangıç:</label>
            <input type="time" id="inpTurkceStart" value="10:15">

            <input type="time" id="inpCografyaStart" value="12:10">

          <div class="setting-item">

            <input type="time" id="inpVatandaslikStart" value="12:20">

  <div class="screen-hint">Tam ekranda fare hareketsiz kaldığında kontroller gizlenir. Çıkmak için ESC veya F tuşuna basabilirsiniz.</div>

  <script>
    // 1. Kadran Çizgileri ve Numaraları
    const ticksGroup = document.getElementById('svgTicksGroup');
    const numbersGroup = document.getElementById('svgNumbersGroup');

    for (let i = 0; i < 60; i++) {
      const angle = i * 6;
      const isHour = i % 5 === 0;
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      const rOuter = 248;
      const rInner = isHour ? 224 : 235;
      const rad = (angle - 90) * (Math.PI / 180);

      line.setAttribute('x1', Math.cos(rad) * rInner);
      line.setAttribute('y1', Math.sin(rad) * rInner);
      line.setAttribute('x2', Math.cos(rad) * rOuter);
      line.setAttribute('y2', Math.sin(rad) * rOuter);
      line.setAttribute('stroke', isHour ? '#111827' : '#374151');
      line.setAttribute('stroke-width', isHour ? 4.5 : 1.8);
      line.setAttribute('stroke-linecap', 'square');
      ticksGroup.appendChild(line);
    }

    const numRadius = 192;
    for (let num = 1; num <= 12; num++) {
      const angle = num * 30;
      const rad = (angle - 90) * (Math.PI / 180);
      const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      text.setAttribute('x', Math.cos(rad) * numRadius);
      text.setAttribute('y', Math.sin(rad) * numRadius + 2);
      text.textContent = num;
      numbersGroup.appendChild(text);
    }

    // 2. Varsayılan Ayarlar & Konfigürasyon
    const DEFAULT_CONFIG = {
      scale: 100,
      examStart: '10:15',
      turkceStart: '10:15',
      matStart: '10:55',
      gkStart: '11:55',
      cografyaStart: '12:10',
      vatandaslikStart: '12:20',
      examEnd: '12:25'
    };

    let config = { ...DEFAULT_CONFIG };

    function loadSavedConfig() {
      try {
        const saved = localStorage.getItem('osym_clock_user_config');
        if (saved) {
          const parsed = JSON.parse(saved);
          config = { ...DEFAULT_CONFIG, ...parsed };
        }
      } catch (e) {
        config = { ...DEFAULT_CONFIG };
      }
      applyConfigToUI();
    }

    function saveConfig() {
      try {
        localStorage.setItem('osym_clock_user_config', JSON.stringify(config));
      } catch (e) {}
    }

    function timeStringToSeconds(tStr) {
      if (!tStr) return 0;
      const parts = tStr.split(':');
      const h = parseInt(parts[0], 10) || 0;
      const m = parseInt(parts, 10) || 0;
      const s = parseInt(parts[2], 10) || 0;
      return h * 3600 + m * 60 + s;
    }

    function secondsToTimeString(sec) {
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
    }

    // 3. Çalışma Durumu Değişkenleri
    let currentMode = 'real'; // 'real' | 'exam'
    let isExamRunning = true;
    let isSoundOn = false;
    let activeBranchKey = 'turkce';

    let examSeconds = timeStringToSeconds(config.examStart);
    let lastTimestamp = performance.now();
    let lastSecondTick = -1;

    // Elementler
    const hourHand = document.getElementById('svgHourHand');
    const minuteHand = document.getElementById('svgMinuteHand');
    const secondHand = document.getElementById('svgSecondHand');

    const topHud = document.getElementById('topHud');
    const modeDisplayLabel = document.getElementById('modeDisplayLabel');
    const examSectionWrapper = document.getElementById('examSectionWrapper');
    const examSectionPill = document.getElementById('examSectionPill');
    const kalanSureTimer = document.getElementById('kalanSureTimer');
    const controlsContainer = document.getElementById('controlsContainer');
    const examControlsRow = document.getElementById('examControlsRow');
    const branchControlsRow = document.getElementById('branchControlsRow');

    const btnModeReal = document.getElementById('btnModeReal');
    const btnModeExam = document.getElementById('btnModeExam');
    const btnFullscreenToggle = document.getElementById('btnFullscreenToggle');
    const btnPlayPause = document.getElementById('btnPlayPause');
    const txtPlayPause = document.getElementById('txtPlayPause');
    const btnResetExam = document.getElementById('btnResetExam');
    const btnToggleSound = document.getElementById('btnToggleSound');
    const txtSound = document.getElementById('txtSound');

    // Branş Düğmeleri
    const btnBranchTurkce = document.getElementById('btnBranchTurkce');
    const btnBranchMat = document.getElementById('btnBranchMat');
    const btnBranchGk = document.getElementById('btnBranchGk');
    const gkDropdownMenu = document.getElementById('gkDropdownMenu');
    const btnSubTarih = document.getElementById('btnSubTarih');
    const btnSubCografya = document.getElementById('btnSubCografya');
    const btnSubVatandaslik = document.getElementById('btnSubVatandaslik');
    const btnBranchCografyaDirect = document.getElementById('btnBranchCografyaDirect');
    const btnBranchVatDirect = document.getElementById('btnBranchVatDirect');

    // Ayarlar Modalı Elementleri
    const btnOpenSettings = document.getElementById('btnOpenSettings');
    const settingsModalBackdrop = document.getElementById('settingsModalBackdrop');
    const btnCloseSettingsX = document.getElementById('btnCloseSettingsX');
    const btnSaveSettings = document.getElementById('btnSaveSettings');
    const btnResetSettingsDefault = document.getElementById('btnResetSettingsDefault');

    const scaleSlider = document.getElementById('scaleSlider');
    const scaleValueBadge = document.getElementById('scaleValueBadge');
    const inpExamStart = document.getElementById('inpExamStart');
    const inpTurkceStart = document.getElementById('inpTurkceStart');
    const inpMatStart = document.getElementById('inpMatStart');
    const inpGkStart = document.getElementById('inpGkStart');
    const inpCografyaStart = document.getElementById('inpCografyaStart');
    const inpVatandaslikStart = document.getElementById('inpVatandaslikStart');
    const inpExamEnd = document.getElementById('inpExamEnd');

    function applyScale(val) {
      const scaleNum = Math.max(50, Math.min(160, parseInt(val, 10) || 100));
      config.scale = scaleNum;
      document.documentElement.style.setProperty('--clock-scale', (scaleNum / 100).toString());
      if (scaleSlider) scaleSlider.value = scaleNum;
      if (scaleValueBadge) scaleValueBadge.textContent = `%${scaleNum}`;
    }

    function applyConfigToUI() {
      applyScale(config.scale);

      // Butonlardaki saat etiketlerini güncelle
      document.querySelectorAll('.lbl-time-turkce').forEach(el => el.textContent = config.turkceStart);
      document.querySelectorAll('.lbl-time-mat').forEach(el => el.textContent = config.matStart);
      document.querySelectorAll('.lbl-time-gk').forEach(el => el.textContent = config.gkStart);
      document.querySelectorAll('.lbl-time-cografya').forEach(el => el.textContent = config.cografyaStart);
      document.querySelectorAll('.lbl-time-vatandaslik').forEach(el => el.textContent = config.vatandaslikStart);

      // Modal inputlarını doldur
      if (inpExamStart) inpExamStart.value = config.examStart;
      if (inpTurkceStart) inpTurkceStart.value = config.turkceStart;
      if (inpMatStart) inpMatStart.value = config.matStart;
      if (inpGkStart) inpGkStart.value = config.gkStart;
      if (inpCografyaStart) inpCografyaStart.value = config.cografyaStart;
      if (inpVatandaslikStart) inpVatandaslikStart.value = config.vatandaslikStart;
      if (inpExamEnd) inpExamEnd.value = config.examEnd;

      if (currentMode === 'exam') {
        updateExamHUD();
      }
    }

    // Ses Motoru (iOS Safari Uyumlu)
    let audioContext = null;
    function initAudio() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioContext && audioContext.state === 'suspended') {
        audioContext.resume();
      }
    }

    function triggerTickAudio() {
      if (!isSoundOn) return;
      try {
        initAudio();
        if (!audioContext) return;

        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(1200, audioContext.currentTime);
        osc.frequency.exponentialRampToValueAtTime(60, audioContext.currentTime + 0.022);

        gain.gain.setValueAtTime(0.25, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.022);

        osc.connect(gain);
        gain.connect(audioContext.destination);
        osc.start();
        osc.stop(audioContext.currentTime + 0.022);
      } catch (err) {}
    }

    // Render Döngüsü
    function render(now) {
      const delta = (now - lastTimestamp) / 1000;
      lastTimestamp = now;

      let h, m, s;

      if (currentMode === 'real') {
        const d = new Date();
        h = d.getHours();
        m = d.getMinutes();
        s = d.getSeconds() + d.getMilliseconds() / 1000;

        const secInt = Math.floor(s);
        if (secInt !== lastSecondTick) {
          lastSecondTick = secInt;
          triggerTickAudio();
        }
      } else {
        const examEndSec = timeStringToSeconds(config.examEnd);

        if (isExamRunning) {
          examSeconds += delta;
          if (examSeconds >= examEndSec) {
            examSeconds = examEndSec;
            isExamRunning = false;
            updatePlayPauseButton();
          }
        }

        const secInt = Math.floor(examSeconds);
        if (secInt !== lastSecondTick && isExamRunning) {
          lastSecondTick = secInt;
          triggerTickAudio();
        }

        h = Math.floor(examSeconds / 3600);
        m = Math.floor((examSeconds % 3600) / 60);
        s = examSeconds % 60;

        updateExamHUD();
      }

      const hourAngle = ((h % 12) + m / 60 + s / 3600) * 30;
      const minuteAngle = (m + s / 60) * 6;
      const secondAngle = Math.floor(s) * 6;

      hourHand.setAttribute('transform', `rotate(${hourAngle})`);
      minuteHand.setAttribute('transform', `rotate(${minuteAngle})`);
      secondHand.setAttribute('transform', `rotate(${secondAngle})`);

      requestAnimationFrame(render);
    }

    // HUD ve Kalan Süre Güncelleme
    function updateExamHUD() {
      const examEndSec = timeStringToSeconds(config.examEnd);
      const remainingSec = Math.max(0, examEndSec - examSeconds);
      const remMins = Math.floor(remainingSec / 60);
      const remSecs = Math.floor(remainingSec % 60);
      kalanSureTimer.textContent = `${remMins.toString().padStart(2, '0')}:${remSecs.toString().padStart(2, '0')}`;

      const tSec = timeStringToSeconds(config.turkceStart);
      const mSec = timeStringToSeconds(config.matStart);
      const gSec = timeStringToSeconds(config.gkStart);
      const cSec = timeStringToSeconds(config.cografyaStart);
      const vSec = timeStringToSeconds(config.vatandaslikStart);

      // Hangi bölümde olduğumuzu belirle (Mobilde kısa metinler)
      const isMobile = window.innerWidth <= 480;

      if (examSeconds >= examEndSec) {
        examSectionPill.textContent = '🏁 Bitti';
        examSectionPill.className = 'hud-pill bitti';
        highlightBranchButton('');
      } else if (examSeconds < mSec) {
        examSectionPill.textContent = isMobile ? 'Türkçe' : 'Türkçe Bölümü';
        examSectionPill.className = 'hud-pill turkce';
        highlightBranchButton('turkce');
      } else if (examSeconds < gSec) {
        examSectionPill.textContent = isMobile ? 'Matematik' : 'Matematik Bölümü';
        examSectionPill.className = 'hud-pill matematik';
        highlightBranchButton('matematik');
      } else if (examSeconds < cSec) {
        examSectionPill.textContent = isMobile ? 'Tarih' : 'Tarih (GK) Bölümü';
        examSectionPill.className = 'hud-pill tarih';
        highlightBranchButton('gk');
      } else if (examSeconds < vSec) {
        examSectionPill.textContent = isMobile ? 'Coğrafya' : 'Coğrafya (GK)';
        examSectionPill.className = 'hud-pill cografya';
        highlightBranchButton('cografya');
      } else {
        examSectionPill.textContent = isMobile ? 'Vatandaşlık' : 'Vatandaşlık & Güncel';
        examSectionPill.className = 'hud-pill vatandaslik';
        highlightBranchButton('vatandaslik');
      }
    }

    function highlightBranchButton(key) {
      activeBranchKey = key;
      btnBranchTurkce.classList.toggle('active-branch', key === 'turkce');
      btnBranchMat.classList.toggle('active-branch', key === 'matematik');
      btnBranchGk.classList.toggle('active-branch', key === 'gk');
      btnBranchCografyaDirect.classList.toggle('active-branch', key === 'cografya');
      btnBranchVatDirect.classList.toggle('active-branch', key === 'vatandaslik');
    }

    function updatePlayPauseButton() {
      if (isExamRunning) {
        txtPlayPause.textContent = '⏸️ Duraklat';
        btnPlayPause.classList.add('active');
      } else {
        txtPlayPause.textContent = '▶️ Başlat';
        btnPlayPause.classList.remove('active');
      }
    }

    // Branş Atlama ve Başlatma Fonksiyonu
    function jumpToBranch(timeString, branchKey) {
      if (currentMode !== 'exam') {
        setExamMode();
      }
      examSeconds = timeStringToSeconds(timeString);
      isExamRunning = true;
      updatePlayPauseButton();
      updateExamHUD();
      highlightBranchButton(branchKey);
      if (gkDropdownMenu) gkDropdownMenu.classList.remove('show');
    }

    function setRealMode() {
      currentMode = 'real';
      btnModeReal.classList.add('active');
      btnModeExam.classList.remove('active');
      examControlsRow.style.display = 'none';
      branchControlsRow.style.display = 'none';
      examSectionWrapper.style.display = 'none';
      modeDisplayLabel.textContent = window.innerWidth <= 480 ? '🕒 Canlı' : '🕒 Canlı Gerçek Saat';
      if (gkDropdownMenu) gkDropdownMenu.classList.remove('show');
    }

    function setExamMode() {
      currentMode = 'exam';
      btnModeExam.classList.add('active');
      btnModeReal.classList.remove('active');
      examControlsRow.style.display = 'flex';
      branchControlsRow.style.display = 'flex';
      examSectionWrapper.style.display = 'inline-flex';
      modeDisplayLabel.textContent = window.innerWidth <= 480 ? '📝 Prova' : '📝 KPSS Prova';
      updateExamHUD();
    }

    btnModeReal.addEventListener('click', setRealMode);
    btnModeExam.addEventListener('click', setExamMode);

    btnPlayPause.addEventListener('click', () => {
      initAudio();
      isExamRunning = !isExamRunning;
      updatePlayPauseButton();
    });

    btnResetExam.addEventListener('click', () => {
      examSeconds = timeStringToSeconds(config.examStart);
      isExamRunning = true;
      updatePlayPauseButton();
      updateExamHUD();
    });

    btnToggleSound.addEventListener('click', () => {
      initAudio();
      isSoundOn = !isSoundOn;
      if (isSoundOn) {
        txtSound.textContent = '🔊 Ses: Açık';
        btnToggleSound.classList.add('active');
      } else {
        txtSound.textContent = '🔇 Ses: Kapalı';
        btnToggleSound.classList.remove('active');
      }
    });

    // Branş Buton Olayları
    btnBranchTurkce.addEventListener('click', () => jumpToBranch(config.turkceStart, 'turkce'));
    btnBranchMat.addEventListener('click', () => jumpToBranch(config.matStart, 'matematik'));
    btnBranchGk.addEventListener('click', (e) => {
      if (e.target.closest('#btnBranchGk')) {
        jumpToBranch(config.gkStart, 'gk');
        gkDropdownMenu.classList.toggle('show');
      }
    });

    btnSubTarih.addEventListener('click', () => jumpToBranch(config.gkStart, 'gk'));
    btnSubCografya.addEventListener('click', () => jumpToBranch(config.cografyaStart, 'cografya'));
    btnSubVatandaslik.addEventListener('click', () => jumpToBranch(config.vatandaslikStart, 'vatandaslik'));
    btnBranchCografyaDirect.addEventListener('click', () => jumpToBranch(config.cografyaStart, 'cografya'));
    btnBranchVatDirect.addEventListener('click', () => jumpToBranch(config.vatandaslikStart, 'vatandaslik'));

    // Sayfa dışı tıklamalarda dropdown kapat
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.dropdown-container')) {
        if (gkDropdownMenu) gkDropdownMenu.classList.remove('show');
      }
    });

    // Ayarlar Modalı İşlemleri
    function openSettingsModal() {
      settingsModalBackdrop.classList.add('open');
      applyConfigToUI();
    }

    function closeSettingsModal() {
      settingsModalBackdrop.classList.remove('open');
    }

    btnOpenSettings.addEventListener('click', openSettingsModal);
    btnCloseSettingsX.addEventListener('click', closeSettingsModal);

    settingsModalBackdrop.addEventListener('click', (e) => {
      if (e.target === settingsModalBackdrop) {
        closeSettingsModal();
      }
    });

    // Canlı Ölçek Kaydırıcı
    scaleSlider.addEventListener('input', (e) => {
      applyScale(e.target.value);
    });

    document.querySelectorAll('.btn-preset').forEach(btn => {
      btn.addEventListener('click', () => {
        const val = btn.getAttribute('data-scale');
        applyScale(val);
      });
    });

    // Ayarları Kaydet
    btnSaveSettings.addEventListener('click', () => {
      config.examStart = inpExamStart.value || DEFAULT_CONFIG.examStart;
      config.turkceStart = inpTurkceStart.value || DEFAULT_CONFIG.turkceStart;
      config.matStart = inpMatStart.value || DEFAULT_CONFIG.matStart;
      config.gkStart = inpGkStart.value || DEFAULT_CONFIG.gkStart;
      config.cografyaStart = inpCografyaStart.value || DEFAULT_CONFIG.cografyaStart;
      config.vatandaslikStart = inpVatandaslikStart.value || DEFAULT_CONFIG.vatandaslikStart;
      config.examEnd = inpExamEnd.value || DEFAULT_CONFIG.examEnd;
      config.scale = parseInt(scaleSlider.value, 10) || 100;

      saveConfig();
      applyConfigToUI();
      closeSettingsModal();
    });

    // Ayarları Varsayılana Sıfırla
    btnResetSettingsDefault.addEventListener('click', () => {
      if (confirm('Bütün saatleri ve ölçeği varsayılan KPSS ayarlarına döndürmek istiyor musunuz?')) {
        config = { ...DEFAULT_CONFIG };
        saveConfig();
        applyConfigToUI();
      }
    });

    // iOS ve Modern Tarayıcı Uyumlu Tam Ekran Motoru
    function isFullscreenActive() {
      return !!(
        document.fullscreenElement ||
        document.webkitFullscreenElement ||
        document.body.classList.contains('is-fullscreen')
      );
    }

    function updateFullscreenButton() {
      const isFull = isFullscreenActive();
      if (isFull) {
        btnFullscreenToggle.classList.add('active');
        btnFullscreenToggle.innerHTML = '<span>✕ Küçült</span>';
      } else {
        btnFullscreenToggle.classList.remove('active');
        btnFullscreenToggle.innerHTML = '<span>⛶ Ekran</span>';
      }
    }

    function toggleFullscreen() {
      const isFull = isFullscreenActive();
      if (!isFull) {
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().then(() => {
            document.body.classList.add('is-fullscreen');
            updateFullscreenButton();
          }).catch(() => {
            // iOS Safari fallback
            document.body.classList.add('is-fullscreen');
            updateFullscreenButton();
          });
        } else if (document.documentElement.webkitRequestFullscreen) {
          try {
            document.documentElement.webkitRequestFullscreen();
          } catch (e) {}
          document.body.classList.add('is-fullscreen');
          updateFullscreenButton();
        } else {
          // iPhone Safari: Görsel tam ekran
          document.body.classList.add('is-fullscreen');
          updateFullscreenButton();
        }
      } else {
        if (document.exitFullscreen && document.fullscreenElement) {
          document.exitFullscreen().then(() => {
            document.body.classList.remove('is-fullscreen');
            updateFullscreenButton();
          }).catch(() => {
            document.body.classList.remove('is-fullscreen');
            updateFullscreenButton();
          });
        } else if (document.webkitExitFullscreen && document.webkitFullscreenElement) {
          try {
            document.webkitExitFullscreen();
          } catch (e) {}
          document.body.classList.remove('is-fullscreen');
          updateFullscreenButton();
        } else {
          document.body.classList.remove('is-fullscreen');
          updateFullscreenButton();
        }
      }
    }

    btnFullscreenToggle.addEventListener('click', toggleFullscreen);

    document.addEventListener('fullscreenchange', () => {
      if (document.fullscreenElement) {
        document.body.classList.add('is-fullscreen');
      } else {
        document.body.classList.remove('is-fullscreen');
      }
      updateFullscreenButton();
    });

    document.addEventListener('webkitfullscreenchange', () => {
      if (document.webkitFullscreenElement) {
        document.body.classList.add('is-fullscreen');
      } else {
        document.body.classList.remove('is-fullscreen');
      }
      updateFullscreenButton();
    });

    // Otomatik Kontrol Gizleme (Idle) & Boş Alana Dokunma ile Gizleme
    let idleTimeout = null;
    function resetIdleTimer() {
      clearTimeout(idleTimeout);
      if (settingsModalBackdrop.classList.contains('open') || (gkDropdownMenu && gkDropdownMenu.classList.contains('show'))) {
        return;
      }
      idleTimeout = setTimeout(() => {
        if (!settingsModalBackdrop.classList.contains('open') && (!gkDropdownMenu || !gkDropdownMenu.classList.contains('show'))) {
          controlsContainer.classList.add('hidden');
          topHud.classList.add('hidden');
        }
      }, 3500);
    }

    function showControls() {
      controlsContainer.classList.remove('hidden');
      topHud.classList.remove('hidden');
      resetIdleTimer();
    }

    window.addEventListener('mousemove', showControls);

    // Ekrana dokunulduğunda: Butonlara tıklanmadıysa kontrolleri aç/kapat (toggle)
    document.body.addEventListener('click', (e) => {
      if (e.target.closest('#controlsContainer') || e.target.closest('.modal-backdrop') || e.target.closest('.top-hud')) {
        resetIdleTimer();
        return;
      }
      const isHidden = controlsContainer.classList.contains('hidden');
      if (isHidden) {
        showControls();
      } else {
        controlsContainer.classList.add('hidden');
        topHud.classList.add('hidden');
      }
    });

    window.addEventListener('keydown', (e) => {
      showControls();
      if (e.key === 'Escape') {
        if (settingsModalBackdrop.classList.contains('open')) {
          closeSettingsModal();
        } else if (gkDropdownMenu && gkDropdownMenu.classList.contains('show')) {
          gkDropdownMenu.classList.remove('show');
        }
      }
      if (e.key === 'f' || e.key === 'F') {
        if (!settingsModalBackdrop.classList.contains('open')) {
          toggleFullscreen();
        }
      }
      if (e.key === ' ') {
        if (currentMode === 'exam' && !settingsModalBackdrop.classList.contains('open')) {
          e.preventDefault();
          initAudio();
          isExamRunning = !isExamRunning;
          updatePlayPauseButton();
        }
      }
    });

    window.addEventListener('resize', () => {
      if (currentMode === 'real') {
        modeDisplayLabel.textContent = window.innerWidth <= 480 ? '🕒 Canlı' : '🕒 Canlı Gerçek Saat';
      } else {
        modeDisplayLabel.textContent = window.innerWidth <= 480 ? '📝 Prova' : '📝 KPSS Prova';
      }
      if (currentMode === 'exam') {
        updateExamHUD();
      }
    });

    // Başlangıç
    loadSavedConfig();
    showControls();
    requestAnimationFrame(render);
  </script>
</body>
</html>
